name: Windows build and validation
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install the pinned Electron runtime
        run: npm run runtime:install
      - run: npm run typecheck
      - name: Domain and SQLite integration tests
        run: npm test
      - name: DOM integration tests
        run: npm run test:ui
      - name: Build
        run: npm run build:node && npm run build:web
      - name: Real Electron smoke (shipped renderer, preload and IPC)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "./node_modules/electron/dist/electron.exe" -ArgumentList "./scripts/electron-smoke.cjs" -Wait -PassThru -RedirectStandardOutput "smoke-out.log" -RedirectStandardError "smoke-err.log"
          Get-Content smoke-out.log, smoke-err.log
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          if (!(Test-Path "screenshots/smoke-results.json")) { throw "Electron smoke did not record its results." }
          $r = Get-Content "screenshots/smoke-results.json" -Raw | ConvertFrom-Json
          if (!$r.flows.invoiceThroughUi -or !$r.flows.oneWindow) { throw "Electron smoke evidence is missing." }
      - name: Build the Windows installer (unsigned test build)
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install silently and start the installed app
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter 'Meyar-Setup-*.exe' | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exited with $($p.ExitCode)." }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Meyar\Meyar.exe'
          if (!(Test-Path $exe)) { throw "Installed Meyar.exe not found at $exe." }
          $app = Start-Process -FilePath $exe -PassThru
          $db = Join-Path $env:APPDATA 'Meyar\data\meyar.sqlite'
          for ($i = 0; $i -lt 30 -and !(Test-Path $db); $i++) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 3
          $alive = !$app.HasExited
          Get-Process -Name Meyar -ErrorAction SilentlyContinue | Stop-Process -Force
          if (!(Test-Path $db)) { throw "The installed app did not create its database." }
          if (!$alive) { throw "The installed app exited right after start." }
          Write-Host "Installed app started and created $db"
      - name: Publish the unsigned test release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "İmzalanmamış sınaq versiyası. Windows 'Windows protected your PC' yazsa: More info -> Run anyway. Məlumat %APPDATA%\Meyar qovluğunda saxlanılır; proqramı silmək məlumatı silmir. Real uçotdan əvvəl mühasib qəbulu lazımdır."
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem release -Filter 'Meyar-Setup-*.exe').FullName --prerelease --title "Meyar $env:GITHUB_REF_NAME (imzalanmamış sınaq versiyası)" --notes $notes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Meyar-screens
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Meyar-Windows-unsigned
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14
