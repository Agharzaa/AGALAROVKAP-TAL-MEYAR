name: Windows build and validation
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install the pinned Electron runtime
        run: npm run runtime:install
      - run: npm run typecheck
      - name: Domain and SQLite integration tests
        run: npm test
      - name: DOM integration tests
        run: npm run test:ui
      - name: Load test (100 000 postings, report budgets)
        run: npm run test:perf
        env:
          MEYAR_PERF_POSTINGS: '100000'
      - name: Build
        run: npm run build:node && npm run build:web
      - name: Real Electron smoke (renderer, preload, IPC, ledger worker)
        shell: pwsh
        run: |
          $env:MEYAR_DATA_DIR = Join-Path $env:RUNNER_TEMP 'meyar-smoke'
          $env:MEYAR_SMOKE = Join-Path $env:RUNNER_TEMP 'smoke.json'
          $p = Start-Process -FilePath "./node_modules/electron/dist/electron.exe" -ArgumentList "." -Wait -PassThru
          $r = Get-Content $env:MEYAR_SMOKE -Raw | ConvertFrom-Json
          if (!$r.company.ok -or !$r.trial -or !$r.integrity) { throw "Electron smoke failed: $(Get-Content $env:MEYAR_SMOKE -Raw)" }
      - name: Build the Windows installer (unsigned test build)
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install silently and start the installed app
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter 'Meyar-Setup-*.exe' | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exited with $($p.ExitCode)." }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Meyar\Meyar.exe'
          if (!(Test-Path $exe)) { throw "Installed Meyar.exe not found at $exe." }
          $env:MEYAR_DATA_DIR = Join-Path $env:RUNNER_TEMP 'meyar-installed'
          $env:MEYAR_SMOKE = Join-Path $env:RUNNER_TEMP 'installed.json'
          $app = Start-Process -FilePath $exe -Wait -PassThru
          $db = Join-Path $env:MEYAR_DATA_DIR 'data\meyar-v3.sqlite'
          if (!(Test-Path $db)) { throw "The installed app did not create its database." }
          $r = Get-Content $env:MEYAR_SMOKE -Raw | ConvertFrom-Json
          if (!$r.company.ok -or !$r.trial -or !$r.integrity) { throw "Installed app smoke failed: $(Get-Content $env:MEYAR_SMOKE -Raw)" }
          Write-Host "Installed app ran the ledger worker and created $db"
      # One prerelease per package version: published from the first validated main build
      # (or a v* tag) whose version has no release yet. Later builds of the same version skip.
      - name: Publish the unsigned test release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v' + (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag already exists; skipping."; exit 0 }
          $notes = "İmzalanmamış sınaq versiyası. Windows 'Windows protected your PC' yazsa: More info -> Run anyway. Məlumat %APPDATA%\Meyar qovluğunda saxlanılır; proqramı silmək məlumatı silmir. Real uçotdan əvvəl mühasib qəbulu lazımdır."
          $setup = (Get-ChildItem release -Filter 'Meyar-Setup-*.exe' | Select-Object -First 1).FullName
          gh release create $tag $setup --target $env:GITHUB_SHA --prerelease --title "Meyar $tag (imzalanmamış sınaq versiyası)" --notes $notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Meyar-screens
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Meyar-Windows-unsigned
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14
